[project]
name = "spec-eval-awareness"
version = "0.1.0"
description = "A fxtr project"
requires-python = ">=3.12.4"
dependencies = [
    "behaviors[models]>=0.0.1a5",
    "fxtr[runner,debug-web]",
    "jsonschema>=4.26.0",
]

[tool.uv]
# Installed (editably) into its own venv, so the `fxtr` command, which has no project directory on
# its path, can import the modules [tool.fxtr] lists.
package = true

[tool.uv.sources]
# The project depends on a checkout of fxtr, by path.
fxtr = { path = "/Users/shuhanbao/fxtr/fxtr", editable = true }
behaviors = { path = "/Users/shuhanbao/fxtr/behaviors", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spec_eval_awareness"]

[tool.fxtr]
# The modules whose import registers the project's steps and workflows: what a process with no
# script of its own (a resume, the CLI, the viewer) imports.
modules = ["spec_eval_awareness.experiment"]

[tool.fxtr.views]
# The project's renderer package (views/): `fxtr views build` builds it into views/dist, which the
# viewer serves.
package = "views"
